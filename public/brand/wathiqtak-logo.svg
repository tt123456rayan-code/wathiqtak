<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071A33"/>
      <stop offset="100%" stop-color="#113D6B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0AD46"/>
      <stop offset="100%" stop-color="#B77B1E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#071A33" flood-opacity="0.16"/>
    </filter>
    <style>
      .brand {
        font-family: "Cairo", "Noto Kufi Arabic", "Tajawal", "Dubai", "Tahoma", "Arial", sans-serif;
        font-weight: 900;
      }
      .tagline {
        font-family: "Cairo", "Tajawal", "Noto Sans Arabic", "Tahoma", "Arial", sans-serif;
        font-weight: 700;
      }
      .sub {
        font-family: "Cairo", "Tajawal", "Tahoma", "Arial", sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F5F7FA"/>
  <rect x="84" y="78" width="1432" height="744" rx="58" fill="#FFFFFF" filter="url(#softShadow)"/>

  <!-- Icon -->
  <g transform="translate(255 250)">
    <path d="M112 36 H278 L360 118 V420 H112 Z" fill="#EEF3F8" stroke="#143B63" stroke-width="15" stroke-linejoin="round"/>
    <path d="M278 36 V118 H360" fill="none" stroke="#143B63" stroke-width="15" stroke-linejoin="round"/>

    <path d="M45 98 H258 L332 172 V462 H45 Z" fill="#FFFFFF" stroke="url(#navyGrad)" stroke-width="18" stroke-linejoin="round"/>
    <path d="M258 98 V172 H332" fill="none" stroke="url(#navyGrad)" stroke-width="18" stroke-linejoin="round"/>

    <line x1="105" y1="220" x2="268" y2="220" stroke="#8B9CAF" stroke-width="15" stroke-linecap="round"/>
    <line x1="105" y1="277" x2="288" y2="277" stroke="#8B9CAF" stroke-width="15" stroke-linecap="round"/>
    <line x1="105" y1="334" x2="245" y2="334" stroke="#8B9CAF" stroke-width="15" stroke-linecap="round"/>

    <path d="M115 390 L195 470 L372 260" fill="none" stroke="url(#goldGrad)" stroke-width="39" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text class="brand" x="1035" y="408"
        font-size="144"
        fill="url(#navyGrad)"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle">وثيقتك</text>

  <line x1="695" y1="472" x2="1375" y2="472" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>

  <text class="tagline" x="1035" y="548"
        font-size="45"
        fill="#A16C16"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle">من ورقة معقدة إلى إجراء واضح</text>

  <text class="sub" x="1035" y="610"
        font-size="29"
        fill="#667589"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle">مساعد ذكي لفهم الوثائق الحكومية</text>
</svg>